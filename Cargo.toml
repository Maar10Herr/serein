[workspace]
members = ["crates/serein-core", "crates/serein-host", "crates/serein-cli"]
resolver = "2"
[workspace.package]
version = "0.1.0-beta.2"
edition = "2021"
license = "GPL-3.0-only"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
